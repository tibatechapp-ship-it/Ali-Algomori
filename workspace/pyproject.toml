[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geologia-workspace"
version = "0.19.0"
description = "Bilingual open-source geoscience platform foundation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.110,<0.128", "pydantic>=2.7,<3.0", "uvicorn>=0.23,<1"]

[project.optional-dependencies]
dev = ["pytest>=7.4,<9", "httpx>=0.24,<0.28", "ruff>=0.5,<1"]
gis = ["pyproj>=3.6,<4"]
pdf = ["pypdf>=7.1.1,<8"]
browser = ["playwright>=1.50,<2"]
formats = ["geopandas>=1.0,<2", "pyogrio>=0.11,<1", "rasterio>=1.4,<2", "laspy>=2.5,<3"]
build = ["pyinstaller>=6.10,<7"]

[project.scripts]
geologia-api = "geologia_workspace.api:run"
geologia-knowledge = "geologia_workspace.knowledge_cli:main"
geologia-desktop = "geologia_workspace.desktop:main"
geologia-backup = "geologia_workspace.backup_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
geologia_workspace = ["data/*.json", "data/knowledge_seed/*.md", "web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W"]
