name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        deps: [latest, termux-compat]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pin pure-python deps (Termux compatibility path)
        if: matrix.deps == 'termux-compat'
        run: pip install "pydantic<2" "fastapi<0.128"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,lint,geo]"
      - name: Lint
        run: ruff check .
      - name: Compile
        run: python -m compileall -q src tests
      - name: Tests
        run: pytest -q

  workspace:
    name: workspace (geologia-workspace)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workspace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,gis]"
      - name: Lint
        run: ruff check .
      - name: Compile
        run: python -m compileall -q src tests
      - name: Tests
        run: pytest -q
