[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geologia"
version = "0.9.0"
description = "GEOLOGIA - bilingual geoscience intelligence platform (foundation)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "pydantic>=1.10.17",
]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.24", "uvicorn>=0.30"]
lint = ["ruff>=0.5"]
geo = ["lasio>=0.31", "tifffile>=2023.7", "pyproj>=3.6", "numpy>=1.24",
       "imagecodecs>=2024.1"]

[project.scripts]
geologia = "geologia.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
geologia = ["data/*.json", "data/reference/*.json",
            "data/knowledge/*.json", "data/knowledge/docs/*.md",
            "data/evaluation/*.json", "data/agents/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
